<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linkshelf</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <h1>Linkshelf</h1>
    <form id="new-link-form">
      <input id="url-input" type="url" placeholder="Enter URL" required>
      <input id="desc-input" type="text" placeholder="Description" required>
      <button type="submit">Add Link</button>
    </form>
    <ul id="link-list"></ul>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
