<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkShelf</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="app">
    <h1>LinkShelf</h1>

    <form id="link-form">
      <label for="title">Title
        <input id="title" name="title" type="text" required autocomplete="off">
      </label>
      <label for="url">URL
        <input id="url" name="url" type="url" required placeholder="https://example.com">
      </label>
      <button type="submit">Add</button>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
    </form>

    <section aria-labelledby="links-heading">
      <h2 id="links-heading">Saved links</h2>
      <ul id="links"></ul>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
