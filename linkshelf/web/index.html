<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linkshelf</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>Linkshelf</h1>
      <form id="linkForm" class="link-form">
        <input type="text" id="urlInput" placeholder="URL" required>
        <input type="text" id="titleInput" placeholder="Title" required>
        <button type="submit">Add Link</button>
      </form>
      <ul id="links" class="links-list"></ul>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
